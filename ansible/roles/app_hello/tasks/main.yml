---
- name: Приложение hello (Angie) и маршруты
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    apply: true
    server_side_apply: { field_manager: hackops, force_conflicts: true }
    definition: "{{ lookup('kubernetes.core.kustomize', dir=repo_dir + '/k8s/overlays/kubeadm') | from_yaml_all | list }}"
