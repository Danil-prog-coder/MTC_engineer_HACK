apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: { name: public-gw, namespace: gateway-system }
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels: { gateway-access: "true" }
