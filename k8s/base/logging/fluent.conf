<source>
  @type prometheus
  bind 0.0.0.0
  port 24231
  metrics_path /metrics
</source>
<source>
  @type prometheus_output_monitor
  interval 10
</source>

<source>
  @type tail
  @id in_tail_app
  path /var/log/containers/hello-*_hello_*.log
  pos_file /fluentd-state/pos/app.pos
  tag kubernetes.*
  read_from_head true
  <parse>
    @type regexp
    expression /^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[FP]) (?<log>.*)$/
    time_format %Y-%m-%dT%H:%M:%S.%N%:z
  </parse>
</source>
<source>
  @type tail
  @id in_tail_gateway
  path /var/log/containers/envoy-*_gateway-system_envoy-*.log
  exclude_path ["/var/log/containers/*_gateway-system_envoy-gateway-*.log"]
  pos_file /fluentd-state/pos/gateway.pos
  tag kubernetes.*
  read_from_head true
  <parse>
    @type regexp
    expression /^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[FP]) (?<log>.*)$/
    time_format %Y-%m-%dT%H:%M:%S.%N%:z
  </parse>
</source>

<filter kubernetes.**>
  @type kubernetes_metadata
  skip_labels true
  skip_container_metadata true
  skip_master_url true
  skip_namespace_metadata true
</filter>

# JSON-логи (access / gateway_access) разбираются. Не-JSON строка (error_log Angie) — ParserError:
# запись уходит в @ERROR (а не теряется) и там получает log_type=error.
<filter kubernetes.**>
  @type parser
  key_name log
  reserve_data true
  remove_key_name_field false
  emit_invalid_record_to_error true
  <parse>
    @type json
  </parse>
</filter>

<match kubernetes.**>
  @type relabel
  @label @OUT
</match>

<label @ERROR>
  # только записи приложений; прочие ошибки (в т.ч. выхода) отбрасываем, чтобы не зациклить конвейер
  <match kubernetes.**>
    @type relabel
    @label @OUT
  </match>
  <match **>
    @type null
  </match>
</label>

<label @OUT>
  # log_type: из JSON, иначе stderr -> error; message для VictoriaLogs (_msg)
  <filter kubernetes.**>
    @type record_transformer
    enable_ruby true
    <record>
      log_type ${record["log_type"] || (record["stream"] == "stderr" ? "error" : "app")}
      message ${record["method"] ? [record["method"], record["path"], record["status"]].join(" ") : record["log"].to_s}
      ts ${record["ts"] || Time.at(time.to_f).utc.strftime("%Y-%m-%dT%H:%M:%S.%NZ")}
    </record>
  </filter>

  # счётчик записей (для сверки полноты логов, F5)
  <filter kubernetes.**>
    @type prometheus
    <metric>
      name fluentd_app_access_records_total
      type counter
      desc Records processed by fluentd before output
      <labels>
        log_type ${log_type}
      </labels>
    </metric>
  </filter>

  <match kubernetes.**>
    @type http
    endpoint "http://victoria-logs.logging.svc:9428/insert/jsonline?_stream_fields=kubernetes.namespace_name,kubernetes.container_name,log_type&_msg_field=message&_time_field=ts"
    compress gzip
    json_array false
    <format>
      @type json
    </format>
    <buffer>
      @type file
      path /fluentd-state/buffer/vl
      flush_interval 2s
      retry_type exponential_backoff
      retry_forever true
      total_limit_size 512MB
      overflow_action block
    </buffer>
  </match>
</label>
