apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources: [monitors.yaml, rules.yaml]
# Grafana sidecar подхватывает ConfigMap с меткой grafana_dashboard (см. helm-values/kube-prometheus-stack.yaml)
generatorOptions:
  disableNameSuffixHash: true
  labels: { grafana_dashboard: "1" }
configMapGenerator:
  - { name: dashboard-gateway, files: [gateway.json=dashboards/gateway.json] }
  - { name: dashboard-app, files: [app.json=dashboards/app.json] }
