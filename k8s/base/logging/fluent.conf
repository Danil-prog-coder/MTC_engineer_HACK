<source>
  @type prometheus
  bind 0.0.0.0
  port 24231
  metrics_path /metrics
</source>
<source>
  @type prometheus_output_monitor
  interval 10
</source>

<source>
  @type tail
  @id in_tail_app
  path /var/log/containers/hello-*_hello_*.log
  pos_file /var/log/fluentd-pos/app.pos
  tag kubernetes.*
  read_from_head true
  <parse>
    @type regexp
    expression /^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[FP]) (?<log>.*)$/
    time_format %Y-%m-%dT%H:%M:%S.%N%:z
  </parse>
</source>
<source>
  @type tail
  @id in_tail_gateway
  path /var/log/containers/envoy-*_gateway-system_envoy-*.log
  exclude_path ["/var/log/containers/*_gateway-system_envoy-gateway-*.log"]
  pos_file /var/log/fluentd-pos/gateway.pos
  tag kubernetes.*
  read_from_head true
  <parse>
    @type regexp
    expression /^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[FP]) (?<log>.*)$/
    time_format %Y-%m-%dT%H:%M:%S.%N%:z
  </parse>
</source>

<filter kubernetes.**>
  @type kubernetes_metadata
  skip_labels true
  skip_container_metadata true
  skip_master_url true
  skip_namespace_metadata true
</filter>

# JSON access / gateway_access логи разбираются; не-JSON (error_log Angie) остаётся строкой
<filter kubernetes.**>
  @type parser
  key_name log
  reserve_data true
  remove_key_name_field false
  emit_invalid_record_to_error false
  <parse>
    @type json
  </parse>
</filter>

# error-лог Angie: stderr без log_type -> log_type=error; message для VictoriaLogs (_msg)
<filter kubernetes.**>
  @type record_transformer
  enable_ruby true
  <record>
    log_type ${record["log_type"] || (record["stream"] == "stderr" ? "error" : "app")}
    message ${record["method"] ? "#{record["method"]} #{record["path"]} #{record["status"]}" : record["log"].to_s}
    ts ${record["ts"] || Time.at(time.to_f).utc.strftime("%Y-%m-%dT%H:%M:%S.%NZ")}
  </record>
</filter>

# счётчик записей (для сверки полноты логов, F5)
<filter kubernetes.**>
  @type prometheus
  <metric>
    name fluentd_app_access_records_total
    type counter
    desc Records processed by fluentd before output
    <labels>
      log_type ${log_type}
    </labels>
  </metric>
</filter>

<match kubernetes.**>
  @type http
  endpoint "http://victoria-logs.logging.svc:9428/insert/jsonline?_stream_fields=kubernetes.namespace_name,kubernetes.container_name,log_type&_msg_field=message&_time_field=ts"
  compress gzip
  json_array false
  <format>
    @type json
  </format>
  <buffer>
    @type file
    path /var/log/fluentd-buffer/vl
    flush_interval 2s
    retry_type exponential_backoff
    retry_forever true
    total_limit_size 512MB
    overflow_action block
  </buffer>
</match>
