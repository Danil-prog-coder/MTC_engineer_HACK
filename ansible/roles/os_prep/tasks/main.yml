---
- name: Отключить swap
  ansible.builtin.command: swapoff -a
  when: ansible_swaptotal_mb | int > 0
- name: Убрать swap из fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s.*)$'
    replace: '# \1'
- name: Модули ядра
  community.general.modprobe: { name: "{{ item }}", state: present, persistent: present }
  loop: [overlay, br_netfilter]
- name: sysctl
  ansible.posix.sysctl:
    name: "{{ item.k }}"
    value: "{{ item.v }}"
    sysctl_file: /etc/sysctl.d/99-k8s.conf
    reload: true
  loop:
    - { k: net.bridge.bridge-nf-call-iptables, v: "1" }
    - { k: net.bridge.bridge-nf-call-ip6tables, v: "1" }
    - { k: net.ipv4.ip_forward, v: "1" }
    - { k: fs.inotify.max_user_instances, v: "1024" }
    - { k: fs.inotify.max_user_watches, v: "524288" }
- name: Базовые пакеты
  ansible.builtin.apt:
    name: [apt-transport-https, ca-certificates, curl, gpg, conntrack, socat, ipset, jq, python3-kubernetes, python3-yaml, python3-venv, python3-pip, uuid-runtime, git, make]
    state: present
    update_cache: true
    cache_valid_time: 3600
- name: Версия установленного Helm
  ansible.builtin.command: /usr/local/bin/helm version --short
  register: helm_installed
  changed_when: false
  failed_when: false
- name: Helm (официальный бинарник get.helm.sh, версия из versions.yaml, проверка sha256)
  when: helm_installed.rc != 0 or not helm_installed.stdout.startswith(versions.helm.version)
  block:
    - name: Скачать архив Helm
      ansible.builtin.get_url:
        url: "https://get.helm.sh/helm-{{ versions.helm.version }}-linux-amd64.tar.gz"
        checksum: "sha256:https://get.helm.sh/helm-{{ versions.helm.version }}-linux-amd64.tar.gz.sha256sum"
        dest: "/tmp/helm-{{ versions.helm.version }}.tar.gz"
        mode: "0644"
        timeout: 60
    - name: Установить helm в /usr/local/bin
      ansible.builtin.unarchive:
        src: "/tmp/helm-{{ versions.helm.version }}.tar.gz"
        dest: /usr/local/bin
        remote_src: true
        include: [linux-amd64/helm]
        extra_opts: [--strip-components=1]
        mode: "0755"
