---
# Секреты генерируются при деплое, в git их нет (R-24). Файл — источник для `make creds`.
- name: Каталог секретов
  ansible.builtin.file: { path: "{{ secrets_dir }}", state: directory, owner: root, mode: "0700" }
- name: Пароль Grafana (генерируется один раз)
  ansible.builtin.shell: umask 077 && openssl rand -base64 18 | tr -d '/+=\n' > {{ secrets_dir }}/grafana-admin-password
  args: { creates: "{{ secrets_dir }}/grafana-admin-password" }
- name: Прочитать пароль Grafana
  ansible.builtin.slurp: { src: "{{ secrets_dir }}/grafana-admin-password" }
  register: grafana_pw
  no_log: true
- name: Secret grafana-admin
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    apply: true
    definition:
      apiVersion: v1
      kind: Secret
      metadata: { name: grafana-admin, namespace: monitoring }
      type: Opaque
      data:
        admin-user: "{{ 'admin' | b64encode }}"
        admin-password: "{{ grafana_pw.content }}"
  no_log: true
