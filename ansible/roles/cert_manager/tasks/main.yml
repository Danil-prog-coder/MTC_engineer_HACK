---
- name: Чарт cert-manager (в локальный кэш)
  ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/fetch_chart.yml"
  vars:
    chart_url: "{{ versions.cert_manager.chart_repo }}/charts/cert-manager-{{ versions.cert_manager.version }}.tgz"
    chart_file: "cert-manager-{{ versions.cert_manager.version }}.tgz"
- name: cert-manager
  kubernetes.core.helm:
    kubeconfig: "{{ kubeconfig }}"
    name: cert-manager
    chart_ref: "/var/cache/hackops/charts/cert-manager-{{ versions.cert_manager.version }}.tgz"
    chart_version: "{{ versions.cert_manager.version }}"
    release_namespace: cert-manager
    wait: true
    timeout: 10m
    values:
      crds: { enabled: true }
  register: helm_cert_manager_cert_manager
  retries: 5
  delay: 20
  until: helm_cert_manager_cert_manager is succeeded
- name: TLS-цепочка (ClusterIssuer, корневой CA, сертификат Gateway)
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    apply: true
    server_side_apply: { field_manager: hackops, force_conflicts: true }
    definition: "{{ lookup('kubernetes.core.kustomize', dir=repo_dir + '/k8s/base/tls') | from_yaml_all | list }}"
  register: tls_apply
  retries: 6
  delay: 10
  until: tls_apply is succeeded   # webhook cert-manager может ответить не сразу
- name: Сертификат hello-tls выпущен
  ansible.builtin.command: kubectl --kubeconfig {{ kubeconfig }} -n gateway-system wait --for=condition=Ready certificate/hello-tls --timeout=180s
  changed_when: false
