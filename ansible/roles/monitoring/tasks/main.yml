---
- name: kube-prometheus-stack
  kubernetes.core.helm:
    kubeconfig: "{{ kubeconfig }}"
    name: kps
    chart_ref: kube-prometheus-stack
    chart_repo_url: "{{ versions.kube_prometheus_stack.chart_repo }}"
    chart_version: "{{ versions.kube_prometheus_stack.version }}"
    release_namespace: monitoring
    wait: true
    timeout: 15m
    values: "{{ lookup('file', repo_dir + '/helm-values/kube-prometheus-stack.yaml') | from_yaml }}"
  register: helm_result
  until: helm_result is succeeded
  retries: 3
  delay: 15
- name: Мониторинг (ServiceMonitor, PodMonitor, PrometheusRule)
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    apply: true
    server_side_apply: { field_manager: hackops, force_conflicts: true }
    definition: "{{ lookup('kubernetes.core.kustomize', dir=repo_dir + '/k8s/base/monitoring') | from_yaml_all | list }}"
