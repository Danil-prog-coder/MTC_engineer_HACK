---
# CRD (Gateway API + Envoy Gateway) весят > 1 МиБ — Helm не сможет сохранить релиз в Secret.
# Рендерим чарт и применяем server-side: changed корректен, релиза Helm нет.
- name: Рендер CRD Gateway API (Standard) и Envoy Gateway
  kubernetes.core.helm_template:
    chart_ref: "{{ envoy_gateway_crds_chart }}"  # docker.io -> mirrors.oci_dockerhub
    chart_version: "{{ versions.envoy_gateway.version }}"
    release_name: eg-crds
    release_namespace: gateway-system
    include_crds: true
    release_values:
      crds:
        gatewayAPI: { enabled: true, channel: standard }
        envoyGateway: { enabled: true }
  register: eg_crds
  changed_when: false  # только рендер, изменения вносит следующая задача
- name: Применить CRD (server-side apply)
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    apply: true
    server_side_apply: { field_manager: hackops, force_conflicts: true }
    definition: "{{ eg_crds.stdout | from_yaml_all | select | list }}"
  retries: 3
  delay: 10
  register: eg_crds_apply
  until: eg_crds_apply is succeeded
- name: Envoy Gateway
  kubernetes.core.helm:
    kubeconfig: "{{ kubeconfig }}"
    name: eg
    chart_ref: "{{ envoy_gateway_chart }}"  # docker.io -> mirrors.oci_dockerhub
    chart_version: "{{ versions.envoy_gateway.version }}"
    release_namespace: gateway-system
    wait: true
    timeout: 10m
    skip_crds: true
    values: "{{ lookup('file', repo_dir + '/helm-values/envoy-gateway.yaml') | from_yaml }}"
  register: helm_envoy_gateway_envoy
  retries: 5
  delay: 20
  until: helm_envoy_gateway_envoy is succeeded
# После первого создания CRD/ValidatingAdmissionPolicy повторный SSA один раз меняет managedFields
# (запись статус-контроллера VAP), из-за чего второй make deploy показывал changed. Повторяем apply
# в первом прогоне — после установки контроллера — чтобы следующий прогон был changed=0.
- name: CRD — стабилизация после первого применения
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    apply: true
    server_side_apply: { field_manager: hackops, force_conflicts: true }
    definition: "{{ eg_crds.stdout | from_yaml_all | select | list }}"
  when: eg_crds_apply is changed
  changed_when: false
- name: Gateway (EnvoyProxy, GatewayClass, Gateway, Certificate)
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    apply: true
    server_side_apply: { field_manager: hackops, force_conflicts: true }
    definition: "{{ lookup('kubernetes.core.kustomize', dir=repo_dir + '/k8s/base/gateway') | from_yaml_all | list }}"
  register: gw_apply
  retries: 6
  delay: 10
  until: gw_apply is succeeded
