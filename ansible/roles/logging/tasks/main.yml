---
- name: Чарт victoria-logs-single (в локальный кэш)
  ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/fetch_chart.yml"
  vars:
    chart_url: "https://github.com/VictoriaMetrics/helm-charts/releases/download/victoria-logs-single-{{ versions.victoria_logs.version }}/victoria-logs-single-{{ versions.victoria_logs.version }}.tgz"
    chart_file: "victoria-logs-single-{{ versions.victoria_logs.version }}.tgz"
    chart_oci: oci://ghcr.io/victoriametrics/helm-charts/victoria-logs-single
    chart_version: "{{ versions.victoria_logs.version }}"
- name: VictoriaLogs
  kubernetes.core.helm:
    kubeconfig: "{{ kubeconfig }}"
    name: victoria-logs
    # .tgz тот же, на который ссылается index.yaml репозитория VictoriaMetrics (GitHub Releases)
    chart_ref: "/var/cache/hackops/charts/victoria-logs-single-{{ versions.victoria_logs.version }}.tgz"
    chart_version: "{{ versions.victoria_logs.version }}"
    release_namespace: logging
    wait: true
    timeout: 10m
    values: "{{ lookup('file', repo_dir + '/helm-values/victoria-logs.yaml') | from_yaml }}"
  register: helm_logging_victorialogs
  retries: 5
  delay: 20
  until: helm_logging_victorialogs is succeeded
- name: Fluentd
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    apply: true
    server_side_apply: { field_manager: hackops, force_conflicts: true }
    definition: "{{ lookup('kubernetes.core.kustomize', dir=repo_dir + '/k8s/base/logging') | from_yaml_all | list }}"
