apiVersion: apps/v1
kind: DaemonSet
metadata: { name: fluentd, namespace: logging, labels: { app: fluentd } }
spec:
  selector: { matchLabels: { app: fluentd } }
  template:
    metadata: { labels: { app: fluentd } }
    spec:
      serviceAccountName: fluentd
      tolerations:
        - { operator: Exists }
      containers:
        - name: fluentd
          image: fluent/fluentd-kubernetes-daemonset:v1.19.3-debian-forward-1.0
          env:
            - { name: FLUENTD_CONF, value: fluent.conf }
            - { name: FLUENT_UID, value: "0" }
          ports:
            - { name: metrics, containerPort: 24231 }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
          volumeMounts:
            - { name: conf, mountPath: /fluentd/etc/fluent.conf, subPath: fluent.conf, readOnly: true }
            - { name: varlog, mountPath: /var/log, readOnly: true }
            - { name: state, mountPath: /var/log/fluentd-pos, subPath: pos }
            - { name: state, mountPath: /var/log/fluentd-buffer, subPath: buffer }
      volumes:
        - name: conf
          configMap: { name: fluentd-conf }
        - name: varlog
          hostPath: { path: /var/log }
        - name: state
          hostPath: { path: /var/lib/fluentd-state, type: DirectoryOrCreate }
