apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata: { name: public-gw, namespace: gateway-system }
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels: { gateway-access: "true" }
    # TLS завершается на Gateway; сертификат выпускает cert-manager (k8s/base/tls)
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.hack.local"
      tls:
        mode: Terminate
        certificateRefs: [{ kind: Secret, name: hello-tls }]
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels: { gateway-access: "true" }
