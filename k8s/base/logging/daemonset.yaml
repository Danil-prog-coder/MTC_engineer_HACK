apiVersion: apps/v1
kind: DaemonSet
metadata: { name: fluentd, namespace: logging, labels: { app: fluentd } }
spec:
  selector: { matchLabels: { app: fluentd } }
  template:
    metadata: { labels: { app: fluentd } }
    spec:
      serviceAccountName: fluentd
      priorityClassName: system-node-critical   # логи узла не должны вытесняться рабочей нагрузкой
      terminationGracePeriodSeconds: 30
      tolerations:
        - { operator: Exists }
      containers:
        - name: fluentd
          image: fluent/fluentd-kubernetes-daemonset:v1.19.3-debian-forward-1.0
          env:
            - { name: FLUENTD_CONF, value: fluent.conf }
            - { name: FLUENT_UID, value: "0" }
          imagePullPolicy: IfNotPresent
          securityContext:
            # root нужен для чтения /var/log/pods (0640 root); эскалация привилегий отключена
            allowPrivilegeEscalation: false
            seccompProfile: { type: RuntimeDefault }
          ports:
            - { name: metrics, containerPort: 24231 }
          readinessProbe:
            httpGet: { path: /metrics, port: metrics }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /metrics, port: metrics }
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 5
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
          volumeMounts:
            - { name: conf, mountPath: /fluentd/etc/fluent.conf, subPath: fluent.conf, readOnly: true }
            - { name: varlog, mountPath: /var/log, readOnly: true }
            - { name: state, mountPath: /fluentd-state/pos, subPath: pos }
            - { name: state, mountPath: /fluentd-state/buffer, subPath: buffer }
      volumes:
        - name: conf
          configMap: { name: fluentd-conf }
        - name: varlog
          hostPath: { path: /var/log }
        - name: state
          hostPath: { path: /var/lib/fluentd-state, type: DirectoryOrCreate }
