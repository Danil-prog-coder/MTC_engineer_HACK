# Почему: снимаем привязку выбора ServiceMonitor/PodMonitor/Rule к меткам релиза,
# чтобы ресурсы из git подхватывались без служебных меток.
fullnameOverride: kps
prometheus:
  prometheusSpec:
    retention: 7d
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    resources:
      requests: { cpu: 200m, memory: 700Mi }
      limits: { memory: 1500Mi }
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: [ReadWriteOnce]
          resources: { requests: { storage: 10Gi } }
alertmanager:
  alertmanagerSpec:
    resources:
      requests: { cpu: 10m, memory: 32Mi }
grafana:
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  sidecar:
    dashboards: { enabled: true, label: grafana_dashboard, searchNamespace: ALL }
  resources:
    requests: { cpu: 50m, memory: 128Mi }
# kubeadm: компоненты control-plane слушают 0.0.0.0 (роль kubeadm_init), поэтому targets зелёные
kubeEtcd:
  enabled: true
  service: { port: 2381, targetPort: 2381 }
kubeControllerManager:
  enabled: true
  service: { port: 10257, targetPort: 10257 }
  serviceMonitor: { https: true, insecureSkipVerify: true }
kubeScheduler:
  enabled: true
  service: { port: 10259, targetPort: 10259 }
  serviceMonitor: { https: true, insecureSkipVerify: true }
kubeProxy:
  enabled: true
  service: { port: 10249, targetPort: 10249 }
kubelet:
  serviceMonitor:
    https: true
    insecureSkipVerify: true
