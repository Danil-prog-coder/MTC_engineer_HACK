---
- name: Чарт kube-prometheus-stack (в локальный кэш)
  ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/fetch_chart.yml"
  vars:
    chart_url: "https://github.com/prometheus-community/helm-charts/releases/download/kube-prometheus-stack-{{ versions.kube_prometheus_stack.version }}/kube-prometheus-stack-{{ versions.kube_prometheus_stack.version }}.tgz"
    chart_file: "kube-prometheus-stack-{{ versions.kube_prometheus_stack.version }}.tgz"
    chart_oci: oci://ghcr.io/prometheus-community/charts/kube-prometheus-stack
    chart_version: "{{ versions.kube_prometheus_stack.version }}"
- name: kube-prometheus-stack
  kubernetes.core.helm:
    kubeconfig: "{{ kubeconfig }}"
    name: kps
    # .tgz тот же, на который ссылается index.yaml репозитория prometheus-community (GitHub Releases)
    chart_ref: "/var/cache/hackops/charts/kube-prometheus-stack-{{ versions.kube_prometheus_stack.version }}.tgz"
    chart_version: "{{ versions.kube_prometheus_stack.version }}"
    release_namespace: monitoring
    wait: true
    timeout: 15m
    values: "{{ lookup('file', repo_dir + '/helm-values/kube-prometheus-stack.yaml') | from_yaml }}"
  register: helm_monitoring_kube_prometheus_stack
  retries: 5
  delay: 20
  until: helm_monitoring_kube_prometheus_stack is succeeded
- name: Мониторинг (ServiceMonitor, PodMonitor, PrometheusRule)
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    apply: true
    server_side_apply: { field_manager: hackops, force_conflicts: true }
    definition: "{{ lookup('kubernetes.core.kustomize', dir=repo_dir + '/k8s/base/monitoring') | from_yaml_all | list }}"
