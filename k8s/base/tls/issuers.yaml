# Цепочка доверия без внешних сервисов: selfSigned -> корневой CA (hack-local-ca) -> выпуск сертификатов.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata: { name: selfsigned }
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: { name: hack-local-ca, namespace: cert-manager }
spec:
  isCA: true
  commonName: hack-local-ca
  secretName: hack-local-ca
  duration: 87600h
  privateKey: { algorithm: ECDSA, size: 256 }
  issuerRef: { name: selfsigned, kind: ClusterIssuer, group: cert-manager.io }
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata: { name: hack-local-ca }
spec:
  ca: { secretName: hack-local-ca }
