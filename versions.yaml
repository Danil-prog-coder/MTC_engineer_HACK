# ЕДИНСТВЕННЫЙ источник версий. Ни одного тега latest.
# Значения, помеченные (verify), сверяются вручную на первой ВМ по чек-листу docs/VERIFY_ON_VM.md.
kubernetes:
  minor: "1.36"
  patch: "1.36.4"          # (verify) последний патч ветки 1.36
  apt_suffix: "-1.1"
  pod_cidr: "10.244.0.0/16"
  service_cidr: "10.96.0.0/12"
containerd:
  apt_version: ""          # пусто = версия из репозитория Ubuntu, фиксируется apt-mark hold
helm:
  version: "v3.17.3"
calico:
  version: "v3.31.0"       # (verify)
local_path_provisioner:
  version: "v0.0.32"       # (verify)
gateway_api:
  crd_version: "v1.6.1"
envoy_gateway:
  chart: "oci://docker.io/envoyproxy/gateway-helm"
  crds_chart: "oci://docker.io/envoyproxy/gateway-crds-helm"
  version: "v1.9.2"
cert_manager:
  chart_repo: "https://charts.jetstack.io"
  version: "v1.19.1"       # (verify)
kube_prometheus_stack:
  chart_repo: "https://prometheus-community.github.io/helm-charts"
  version: "77.13.0"       # (verify)
victoria_logs:
  chart_repo: "https://victoriametrics.github.io/helm-charts"
  version: "0.11.12"       # (verify)
images:
  angie: "docker.angie.software/angie:1.12.1-minimal"
  nginx_fallback: "nginxinc/nginx-unprivileged:1.28.0-alpine"
  fluentd: "fluent/fluentd-kubernetes-daemonset:v1.19.3-debian-forward-1.0"  # (verify) >=1.19.3
  curl: "curlimages/curl:8.11.1"
