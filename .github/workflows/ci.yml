name: ci
on:
  push: { branches: [main] }
  pull_request:

permissions: { contents: read }

jobs:
  lint-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - name: Зависимости
        run: |
          pip install -r requirements.txt -r requirements-dev.txt -e "tools/hackops[dev]"
          ansible-galaxy collection install -r ansible/requirements.yml
      - name: yamllint
        run: yamllint -c .yamllint ansible k8s helm-values versions.yaml
      - name: ruff и mypy
        run: |
          ruff check tools/hackops
          cd tools/hackops && mypy
      - name: Unit-тесты hackops
        run: pytest -q tools/hackops
      - name: Сгенерированные файлы актуальны
        run: |
          python scripts/gen_hello.py
          python scripts/gen_dashboards.py
          git diff --exit-code -- k8s
      - name: ansible syntax-check
        run: ANSIBLE_CONFIG=ansible/ansible.cfg ansible-playbook -i ansible/inventory/local.yml ansible/site.yml --syntax-check
      - name: Нет секретов и тега latest
        run: |
          ! grep -rEn --include='*.yaml' --include='*.yml' --include='*.conf' ':latest\b' k8s helm-values versions.yaml
          ! git ls-files | grep -E '\.(key|pem)$'

  kubernetes-manifests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: kustomize build всех сборок
        run: for d in k8s/base/* k8s/overlays/*; do kubectl kustomize "$d" > "/tmp/$(basename "$d").yaml" && echo "OK $d"; done
      - name: kubeconform (схемы Kubernetes + CRD из datree)
        run: |
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          ./kubeconform -strict -ignore-missing-schemas -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /tmp/*.yaml
